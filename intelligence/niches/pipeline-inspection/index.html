from gas and liquid pipelines. Chemical injection pigging treats internal corrosion. These services extend pipeline life and are required for ILI pre-conditioning runs. Recurring revenue tied to pipeline operations cycles.\n\n### 81. Pipeline Dewatering & Chemical Treatment Companies\n- **Rationale:** After hydrostatic testing, pipelines must be dewatered and dried before commissioning. Chemical treatment inhibits internal corrosion during the dewatering process. Project-based service tied directly to new construction and major maintenance programs.\n\n### 82. Pipeline Cleaning & Gel Pigging Contractors\n- **Rationale:** Gel pigging uses viscoelastic gels to remove debris, scale, and wax from pipelines before ILI runs. Required by most ILI service providers as a condition of tool deployment. Growing demand as ILI frequency increases across aging infrastructure.\n\n### 83. Pipeline Pressure Management & Regulation Companies\n- **Rationale:** Companies that design, install, and maintain pipeline pressure regulation equipment \u2014 reducing stations, regulators, and pressure relief valves. Growing market from distribution system upgrades and new pipeline installations.\n\n---\n\n## Sub-Category 12 (continued): Subsea & Specialized Inspection\n\n### 84. Subsea & Offshore Pipeline Inspection Companies\n- **Rationale:** Offshore pipeline inspection requires remotely operated vehicles (ROVs) and specialized equipment. A premium, technically demanding market dominated by a handful of specialized firms. Buyers are offshore oil and gas operators. Higher contract values ($500K-$5M per inspection campaign) and strong regulatory requirements under BSEE.\n\n### 85. Subsea ROV Inspection Service Providers\n- **Rationale:** ROV companies that deploy unmanned submersibles for visual and non-destructive inspection of subsea pipelines and risers. Growing market as offshore infrastructure ages and BSEE inspection requirements tighten. Decision-makers are offshore operations and integrity managers at major oil companies.\n\n### 86. Offshore Pipeline Integrity Assessment Firms\n- **Rationale:** Engineering firms that interpret subsea inspection data and produce integrity assessments under DNV standards for offshore pipelines. Premium consulting with high per-project fees. Close connection to major offshore operators.\n\n### 87. River Crossing & Waterway Pipeline Inspection Specialists\n- **Rationale:** Buried pipeline crossings at rivers and waterways require specialized inspection techniques \u2014 often a combination of above-water survey, cathodic protection monitoring, and limited ROV deployment. Growing market from PHMSA's focus on water body crossings following major incidents.\n\n### 88. Cased Pipeline Inspection Specialists\n- **Rationale:** Many pipelines are installed in steel casings under roads and railroads. Assessing the condition of the carrier pipe within the casing is technically challenging and requires specialized tools. Growing regulatory pressure to assess and remediate cased crossings.\n\n### 89. Pipeline Ditch Inspection & Backfill Assessment Companies\n- **Rationale:** Ditch condition \u2014 the quality of backfill, grade, and surface conditions around buried pipelines \u2014 affects integrity. Above-ground survey methods combined with excavation are used to assess ditch conditions. Niche service tied to direct assessment programs.\n\n### 90. Pipeline Surveillance & Aerial Patrol Services\n- **Rationale:** PHMSA requires operators to patrol their pipelines regularly by foot, vehicle, or aircraft to detect third-party damage, ground movement, and surface indications. Aerial patrol companies use fixed-wing aircraft, helicopters, and increasingly drones to fulfill this requirement. Growing drone adoption is creating new market entrants.\n\n---\n\n## Sub-Category 13: Engineering, Analytics & Emerging Technology\n\n### 91. Pipeline Vapor Dispersion & Consequence Analysis Firms\n- **Rationale:** These engineering consultants model the potential consequences of pipeline ruptures \u2014 vapor cloud dispersion, fire effects, thermal radiation zones. Required for HCA delineation and emergency response planning. Regulatory driver and identifiable operator buyer audience.\n\n### 92. Pipeline Failure Investigation & Root Cause Analysis Firms\n- **Rationale:** Following a pipeline incident, operators and PHMSA require independent root cause analysis. These firms deploy to incident sites, collect evidence, and produce formal root cause reports. Premium per-event pricing and urgent demand timing. PHMSA incident database is a real-time buying signal monitor.\n\n### 93. Pipeline Engineering Peer Review Firms\n- **Rationale:** Independent technical review of engineering analyses, fitness-for-service assessments, and integrity management methodologies. Required by some operators and regulators as a quality control step. Small but growing market as technical complexity increases.\n\n### 94. Third-Party Pipeline Safety Auditing Companies\n- **Rationale:** Independent auditors who assess pipeline operator compliance with their own IMPs and with PHMSA regulations. Growing demand from large operators seeking to validate their internal programs and from state pipeline safety agencies. Buyers are VP Integrity, HSE Directors, and Regulatory Affairs teams.\n\n### 95. Pipeline Workforce Training & Certification Companies\n- **Rationale:** Training firms that provide ILI data analyst certification, integrity management training, CP technician certification (NACE/AMPP), and pipeline safety professional development. Large workforce demand driver as the industry faces a significant skills gap. Growing market as the experienced pipeline workforce retires.\n\n### 96. Pipeline Inspector Staffing & Recruiting Agencies\n- **Rationale:** Staffing agencies that provide contract pipeline inspection personnel \u2014 ILI analysts, CP technicians, integrity engineers, and field inspection crews. The pipeline inspection industry has chronic workforce shortages. These staffing firms serve both inspection companies and operators directly. Cold email to inspection company operations managers is a natural audience.\n\n### 97. Pipeline Industry Software & Analytics Vendors\n- **Rationale:** A growing ecosystem of specialized software companies building tools for pipeline risk modeling, integrity data management, SCADA integration, and regulatory reporting. SaaS model with high gross margins and strong growth potential. Their marketing challenge is reaching new operator customers. Cold email and LinkedIn are well-suited for this audience.\n\n### 98. Pipeline Fitness-for-Service Software Developers\n- **Rationale:** Software that automates ASME B31G, RSTRENG, and API 579 calculations for anomaly evaluation. Growing market as ILI data volumes require automated assessment tools. Decision-makers are Pipeline Integrity Engineers and Data Analysts at operators. Strong fit for cold outreach.\n\n### 99. Methane Emission Detection & Quantification Companies\n- **Rationale:** A fast-growing segment driven by EPA's Methane Waste Prevention Rule and SEC climate disclosure requirements. Companies offering mobile and fixed methane detection, quantification, and reporting for gas operators. New buyer segments (investor-facing ESG reporting teams at public operators) in addition to traditional operations buyers. High growth rate and significant investor attention.\n\n### 100. Pipeline Condition Monitoring & Predictive Analytics Firms\n- **Rationale:** Advanced analytics firms using machine learning and sensor data to predict pipeline degradation before it reaches reportable anomaly levels. Growing interest from major operators seeking to shift from reactive to predictive integrity management. Premium positioning with a differentiated technology story \u2014 ideal for cold email that leads with the AI/ML value proposition to pipeline integrity leaders.\n\n---\n\n*Rationale prepared using PHMSA pipeline safety data, DOT pipeline statistics, API industry reports, and IBISWorld market research. All market estimates are based on publicly available data as of Q1 2026.*\n";

document.getElementById('analysis-content').innerHTML = marked.parse(ANALYSIS_MD);
document.getElementById('rationale-content').innerHTML = marked.parse(RATIONALE_MD);

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

let currentFilter = 'all';
let currentSort = { col: 'Composite_10pt', dir: 'desc' };
let currentPage = 1;
const PAGE_SIZE = 50;
let filtered = [...NICHES];

function setFilter(f) {
  currentFilter = f;
  currentPage = 1;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + f).classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  filtered = NICHES.filter(n => {
    if (currentFilter === 'core' && !n.is_core) return false;
    if (currentFilter === 'add' && n.is_core) return false;
    if (q && !n.Niche.toLowerCase().includes(q)) return false;
    return true;
  });
  filtered.sort((a, b) => {
    let av, bv;
    if (currentSort.col === 'type') { av = a.is_core ? 0 : 1; bv = b.is_core ? 0 : 1; }
    else { av = a[currentSort.col]; bv = b[currentSort.col]; }
    if (!isNaN(+av) && !isNaN(+bv)) { av = +av; bv = +bv; }
    if (av < bv) return currentSort.dir === 'asc' ? -1 : 1;
    if (av > bv) return currentSort.dir === 'asc' ? 1 : -1;
    return 0;
  });
  document.getElementById('count-label').textContent = 'Showing ' + filtered.length + ' niches';
  renderPage();
}

function scoreColor(s) {
  const v = parseFloat(s);
  if (v >= 9.0) return '#4fc3f7';
  if (v >= 8.0) return '#81c784';
  if (v >= 7.0) return '#ffb74d';
  return '#ef5350';
}

function fmt(n) { return (+n).toLocaleString(); }

function renderPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const body = document.getElementById('table-body');
  body.innerHTML = page.map((n, i) => {
    const score = parseFloat(n.Composite_10pt);
    const scoreW = (score / 10 * 100).toFixed(0);
    const color = scoreColor(score);
    const riskClass = n.StressC_Cashflow_Risk === 'LOW' ? 'risk-low' : n.StressC_Cashflow_Risk === 'MEDIUM' ? 'risk-medium' : 'risk-high';
    return '<tr>' +
      '<td><span style="color:var(--text-muted);font-size:0.75rem;margin-right:8px">' + (start+i+1) + '</span><span class="niche-name">' + n.Niche + '</span></td>' +
      '<td><span class="badge ' + (n.is_core ? 'badge-core' : 'badge-add') + '">' + (n.is_core ? 'Core' : 'Add') + '</span></td>' +
      '<td><div class="score-bar-wrap"><div class="score-bar"><div class="score-bar-fill" style="width:' + scoreW + '%;background:' + color + '"></div></div><span class="score-num" style="color:' + color + '">' + score.toFixed(1) + '</span></div></td>' +
      '<td class="money">$' + fmt(n.LTV_USD) + '</td>' +
      '<td class="money">$' + fmt(n.Typical_Deal_USD) + '</td>' +
      '<td>' + n.Gross_Margin_pct + '%</td>' +
      '<td>' + n.Cushion_0to4 + '/4</td>' +
      '<td class="' + riskClass + '">' + n.StressC_Cashflow_Risk + '</td>' +
      '<td>' + n.Sales_Cycle_days + 'd</td>' +
      '</tr>';
  }).join('');
  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if (total <= 1) { pag.innerHTML = ''; return; }
  let btns = '<button class="page-btn" onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage===1?'disabled':'') + '>Prev</button>';
  for (let p = 1; p <= total; p++) {
    if (total > 12 && Math.abs(p - currentPage) > 3 && p !== 1 && p !== total) continue;
    btns += '<button class="page-btn ' + (p===currentPage?'active':'') + '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  btns += '<button class="page-btn" onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage===total?'disabled':'') + '>Next</button>';
  pag.innerHTML = btns;
}

function goPage(p) {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderPage();
  document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function sortBy(col) {
  if (currentSort.col === col) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort.col = col;
    currentSort.dir = 'desc';
  }
  currentPage = 1;
  applyFilters();
}

applyFilters();
</script>
