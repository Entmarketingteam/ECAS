 with program development training create a bundled service offering. Fastenal and Grainger dominate commodity sales; boutique LOTO specialists differentiate on program consulting and custom device engineering.\n\n### 68. Safety Committee Facilitation Consultants\n*   **Rationale:** OSHA requires safety committees in many state plan states (Washington, Oregon, California, Michigan), and voluntary safety committees are a best practice in all jurisdictions. Safety committee facilitation consultants help companies structure, run, and document their safety committee activities. HR directors and plant managers at mid-market manufacturers are primary buyers. Simple, recurring engagement with high client retention.\n\n### 69. Motor Vehicle & Fleet Safety Consultants\n*   **Rationale:** Motor vehicle accidents are the #1 cause of occupational fatalities in the US \u2014 exceeding all other cause categories. Fleet safety consultants serve construction companies, utilities, delivery companies, and any employer with mobile workers. OSHA's emerging attention to distracted driving and telematics-based safety programs creates acute consulting demand. Fleet managers and risk managers are primary buyers.\n\n### 70. Forklift & Powered Industrial Truck Safety Trainers\n*   **Rationale:** Forklift-related fatalities (~85/year per BLS) and the high citation rate for OSHA 1910.178 make forklift safety training a large, recurring market. OSHA requires initial training and evaluation of every forklift operator, plus refresher training when unsafe operation is observed or an accident occurs. Warehousing, manufacturing, and distribution centers are primary buyers. Training renewal cycles create predictable recurring revenue.\n\n---\n\n## Sub-Category O: Fire Safety & Hazardous Materials\n\n### 71. Fire Safety & Life Safety Code Consulting Firms\n*   **Rationale:** Building fire safety (OSHA 1910 Subpart E; NFPA 101 Life Safety Code; IBC) requires consulting expertise for occupancy analysis, egress planning, and sprinkler/fire alarm compliance. Architects, building owners, and facility managers hire fire safety consultants for renovations, occupancy changes, and compliance audits. The Authority Having Jurisdiction (AHJ) relationship is critical \u2014 fire safety consultants who work well with local fire marshals build sustainable referral businesses.\n\n### 72. NFPA Compliance Consulting Firms\n*   **Rationale:** NFPA (National Fire Protection Association) publishes 300+ codes and standards that are adopted by reference in OSHA regulations and state building codes. NFPA compliance consulting spans electrical safety (NFPA 70E), fire protection (NFPA 13), life safety (NFPA 101), and hazardous materials storage (NFPA 400). Manufacturing, healthcare, and data center operators are primary buyers. Technical expertise barrier limits competition.\n\n### 73. Hazardous Materials (HazMat) Response Consultants\n*   **Rationale:** OSHA's HAZWOPER standard (1910.120) requires emergency response training and planning for hazardous materials incidents. HAZWOPER training, emergency response plan development, and tabletop exercise facilitation create recurring revenue. Industrial facilities (refineries, chemical plants, manufacturing) and municipalities with hazmat teams are primary buyers. OSHA citations under HAZWOPER are significant and recurring.\n\n### 74. DOT Safety Compliance Consultants (Transportation)\n*   **Rationale:** The Department of Transportation (FMCSA, PHMSA, FAA, FRA) regulates commercial vehicle operators, HazMat shippers, and transportation workers. DOT drug & alcohol testing, FMCSA Safety Management Systems (SMS) scores, and HazMat shipping compliance create ongoing consulting demand. Trucking companies, freight forwarders, and chemical shippers are primary buyers.\n\n### 75. MSHA Safety Consultants (Mining Safety & Health Administration)\n*   **Rationale:** MSHA operates separately from OSHA with more frequent inspection cycles (quarterly for underground mines) and a distinct citation and penalty structure. Mining safety consultants require MSHA-specific expertise \u2014 a credential and experiential barrier that protects margins. Coal, hard rock, aggregate, and industrial mineral operations are all covered. MSHA's Pattern of Violations (POV) enforcement creates acute demand for external compliance support.\n\n---\n\n## Sub-Category P: Advanced & Specialized Regulatory Consulting\n\n### 76. EPA & OSHA Dual-Regulatory Compliance Firms\n*   **Rationale:** Chemical facilities, refineries, and manufacturers often face overlapping EPA and OSHA jurisdiction \u2014 EPA's Risk Management Program (RMP) and OSHA's PSM standard both apply to highly hazardous chemicals, requiring coordinated compliance. Dual-regulatory consultants command premium rates for integrating OSHA and EPA requirements into unified compliance programs. This highly specialized niche serves the largest industrial buyers.\n\n### 77. Process Hazard Analysis (PHA) & HAZOP Facilitators\n*   **Rationale:** PHAs and HAZOPs (Hazard & Operability Studies) are required every 5 years under OSHA's PSM standard for covered facilities. Facilitation requires certified engineers (often Certified Functional Safety Experts or CCPSC holders). Refineries, chemical plants, and ammonia refrigeration facilities are primary buyers. PHAs run $50,000\u2013$300,000 \u2014 among the highest-value discrete consulting engagements in the EHS industry.\n\n### 78. Safety Case & Risk Assessment Consultants\n*   **Rationale:** Safety case methodology (common in UK, Australia, offshore oil) is expanding into US nuclear, aerospace, and defense markets. Quantitative risk assessment (QRA) using fault tree analysis and consequence modeling commands premium fees. Consultants serving offshore oil (BSEE's SEMS regulation), nuclear (NRC), and defense (DoD) clients operate at the highest fee levels in the EHS consulting market.\n\n### 79. Behavior-Based Safety (BBS) Software Providers\n*   **Rationale:** BBS observation platforms (SafeStart, Predictive Solutions, Dellbrook JKS's SafeCoast) automate the collection and analysis of safety observations \u2014 identifying at-risk behaviors before incidents occur. SaaS model with per-seat pricing creates recurring revenue and strong LTV. EHS directors and VP Safety at large manufacturing firms are the primary buyers. Marketing-sophisticated buyers who respond to data-driven outbound messaging.\n\n### 80. Learning Management System (LMS) Companies for Safety Training\n*   **Rationale:** Safety-specific LMS platforms (Vector Solutions, Alchemy, KPA) deliver OSHA-required training to distributed workforces at scale. The market for compliance LMS is $2B+ and growing as remote/hybrid work and distributed manufacturing increase the challenge of in-person training delivery. HR directors and EHS managers at mid-to-large employers are primary buyers. Cold email is a primary channel for B2B SaaS sales in this category.\n\n---\n\n## Sub-Category Q: Safety Technology Applications\n\n### 81. Safety Observation & Inspection App Companies\n*   **Rationale:** Mobile safety inspection platforms (SafetyCulture/iAuditor, Fulcrum, GoAudits) enable frontline supervisors to conduct and document safety inspections on smartphones. Market penetration of these platforms among mid-market industrial companies is still below 30% \u2014 leaving a large addressable market. Operations directors and EHS managers are primary buyers. Freemium-to-paid conversion models make cold email outreach to prospects at the free tier highly effective.\n\n### 82. Incident Management & Investigation Software Firms\n*   **Rationale:** OSHA requires employers to investigate workplace incidents \u2014 and best practice requires formal root cause analysis using established methodologies (5-Why, Fishbone, TapRoot). Software platforms automating incident investigation (Intelex, Cority, Enablon) serve enterprise safety departments. Mid-market manufacturers relying on paper-based investigation forms are the underserved segment for SaaS outbound campaigns.\n\n### 83. EHS Consulting for Mergers & Acquisitions Due Diligence\n*   **Rationale:** M&A transactions increasingly require EHS due diligence \u2014 environmental liabilities, OSHA citation history, process safety compliance, and industrial hygiene program adequacy are all material to deal valuation. EHS consultants serving M&A advisory firms and private equity buyers work on accelerated timelines with high urgency and premium billing rates. Cold email targeting M&A attorneys and PE operating partners is an accessible channel for this specialized niche.\n\n### 84. EHS Performance Benchmarking Consultants\n*   **Rationale:** Corporations and trade associations use OSHA TRIR/DART benchmarking to compare safety performance against industry peers. Consultants providing benchmarking analysis (NAICS-level OSHA data analysis) and target-setting support serve corporate EHS departments at large industrial companies. BLS and OSHA data are publicly available \u2014 consultants who package and contextualize this data add significant value.\n\n### 85. Contractor Safety Management (CSM) Program Consultants\n*   **Rationale:** Companies using contract labor (refineries, manufacturers, utilities) must manage the EHS prequalification and ongoing performance of dozens to thousands of contractors. CSM program consultants develop contractor safety requirements, qualification checklists, and oversight protocols. The ISNetworld and Avetta ecosystems have made contractor safety prequalification a board-level concern. Owner-operator EHS directors and procurement managers are primary buyers.\n\n---\n\n## Sub-Category R: Prequalification & Regulatory Compliance Operations\n\n### 86. Safety Prequalification & Vetting Service Companies (ISNetworld/Avetta)\n*   **Rationale:** ISNetworld and Avetta manage safety prequalification networks with hundreds of thousands of contractor members. Third-party consultants who help contractors navigate prequalification requirements and maintain their ISN/Avetta accounts serve a large recurring market. Contractors pay $2,000\u2013$15,000/year for prequalification management assistance. Cold email to construction and industrial contractors warning about prequalification lapses is a high-urgency, high-response outbound strategy.\n\n### 87. OSHA Heat Illness Prevention Program Consultants\n*   **Rationale:** OSHA's Heat Illness Prevention Standard (proposed rulemaking, expected final 2026) will require written heat safety plans for outdoor and indoor heat-exposed workers across many industries. This regulatory trigger will create acute demand for heat illness prevention program development. Construction, agriculture, warehousing, and food processing firms are primary buyers. Proactive outbound before the rule finalizes positions consultants as the expert of record.\n\n### 88. Struck-By & Heavy Equipment Safety Specialists\n*   **Rationale:** Struck-by incidents (second leading cause of construction fatalities after falls) are driven by heavy equipment operating near workers. OSHA's focus on struck-by prevention has increased through National Emphasis Programs on construction fatalities. Safety consultants specializing in heavy equipment safety, spotter training, and proximity detection systems serve a growing market as equipment OEMs integrate safety technology.\n\n### 89. Subcontractor Safety Program Management Firms\n*   **Rationale:** General contractors on large projects (commercial construction, industrial turnarounds, infrastructure) are responsible for subcontractor safety performance under multi-employer OSHA doctrine. Subcontractor safety program management firms provide program oversight, orientation, and performance tracking. Large GCs and owner-operators with extensive contractor populations are primary buyers.\n\n### 90. Job Site Safety Inspection Services (Third-Party)\n*   **Rationale:** Owner-operators of construction projects (real estate developers, municipalities, utilities) hire third-party safety inspectors to verify GC and subcontractor OSHA compliance \u2014 shifting liability exposure. Inspection services billed per visit ($500\u2013$2,000/inspection) or via weekly retainer create recurring revenue. Real estate developers and project managers are primary buyers \u2014 reachable through LinkedIn and commercial real estate networks.\n\n---\n\n## Sub-Category S: Training Media, Insurance & Grant Services\n\n### 91. Safety Training Film & eLearning Content Production Companies\n*   **Rationale:** OSHA-compliant safety training requires documented, defensible content. Production companies creating safety training films, eLearning modules, and microlearning content serve both end-user employers and training platform companies. Localization (Spanish, Mandarin, Tagalog for diverse workforces) is a growing service line. EHS directors and corporate learning departments are primary buyers. Content production companies serving this niche are a defined, addressable market.\n\n### 92. OSHA Mock Inspection & Pre-Audit Services\n*   **Rationale:** Companies preparing for known or anticipated OSHA inspections hire consultants to conduct mock walk-arounds, identify violations, and correct them before enforcement contact. Mock inspections are charged at $3,000\u2013$15,000 per visit. Manufacturing plants, construction projects near active OSHA offices, and companies with recent incidents are primary buyers. Urgency-driven purchasing makes response rates to relevant cold email unusually high.\n\n### 93. Workers' Compensation Insurance Brokerages (Safety-Focused)\n*   **Rationale:** Workers' comp insurance brokerages that differentiate on safety program improvement \u2014 reducing EMR and premium costs \u2014 serve mid-market manufacturers and contractors. These brokerages work with employers to implement safety programs as a loss control tool. Cold email agency services enable these brokerages to proactively target employers with high EMRs \u2014 a public data point available from state rating bureaus.\n\n### 94. Safety Grant Writing & OSHA SHARP Program Consultants\n*   **Rationale:** OSHA's SHARP (Safety and Health Achievement Recognition Program) provides recognition and citation exemption for small businesses achieving safety excellence. State OSHA programs offer grants and free consultation. Consultants who help small manufacturers navigate SHARP applications and state safety grant programs serve an underserved market. SBA networks, SBDC advisors, and manufacturing extension partnerships (MEPs) provide channel partnerships.\n\n### 95. EHS Regulatory Update & Subscription Services\n*   **Rationale:** OSHA, EPA, and state agency regulatory updates are critical intelligence for compliance professionals. Subscription services (Enhesa, EHS Daily Advisor, Compliance & Safety) deliver regulatory tracking to EHS managers and legal departments. SaaS subscription model with strong retention. Cold email targeting corporate EHS directors and legal department regulatory counsel is the primary acquisition channel for these platforms.\n\n---\n\n## Sub-Category T: Advanced Compliance, Analytics & Specialized Services\n\n### 96. OSHA Penalty Reduction & Informal Conference Representation\n*   **Rationale:** Every employer receiving an OSHA citation has 15 working days to contest \u2014 and nearly all citations are negotiated in informal conference. Consultants and attorneys specializing in penalty reduction can often reduce fines by 30\u201370%. Urgency of citations (15-day window) creates immediate demand upon citation receipt. Cold email to companies recently cited (using the OSHA citation database) is a laser-targeted acquisition strategy for these firms.\n\n### 97. Drug & Alcohol Testing Program Administrators\n*   **Rationale:** OSHA's drug testing provisions (post-incident testing guidance), DOT drug testing requirements, and state-level marijuana accommodation laws create a complex compliance environment for employers. Third-party administrators (TPAs) managing drug testing programs serve transportation, construction, and federal contractors. Cold email targeting safety managers and HR directors at DOT-regulated employers is a defined, reachable market.\n\n### 98. Return-to-Work Program Consultants\n*   **Rationale:** OSHA and workers' compensation programs both incentivize rapid return to work following workplace injuries. RTW program consultants develop modified duty programs, communicate with treating physicians, and coordinate with insurance adjusters to reduce lost-time claims. Risk managers and HR directors are primary buyers. Strong ROI data \u2014 RTW programs reduce workers' comp costs 20\u201340% \u2014 makes the cold email value proposition compelling.\n\n### 99. Safety Performance Dashboard & Analytics Companies\n*   **Rationale:** Data analytics platforms visualizing safety leading and lagging indicators (TRIR, DART, near-miss frequency, inspection completion rates) are a growing segment. EHS directors at large industrial companies increasingly demand data-driven safety program management. Vendors providing safety analytics (Predictive Solutions, Intelex Analytics) compete in a market where cold email to corporate EHS teams is the primary B2B acquisition channel.\n\n### 100. Industrial Hygiene Equipment Rental & Calibration Services\n*   **Rationale:** Air sampling pumps, noise dosimeters, gas detectors, and direct-reading instruments require calibration and NIST-traceability verification. Equipment rental and calibration services serve industrial hygienists at consulting firms and in-house EHS departments. Recurring annual calibration revenue creates a subscription-like model. Cold email targeting AIHA members and industrial hygiene professionals at manufacturing firms is a precise, reachable audience.\n\n---\n\n*Rationale prepared using ASSP membership data, OSHA citation database analysis, IBISWorld EHS Consulting industry reports, AIHA workforce data, and Verdantix EHS Technology market sizing.*\n";

const CORE_COUNT = 100;
let currentSort = 'Composite_10pt';
let currentDir = 'desc';

document.getElementById('analysisContent').innerHTML = marked.parse(DEEP_ANALYSIS);
document.getElementById('rationaleContent').innerHTML = marked.parse(RATIONALE);

function renderStats() {
  const composites = NICHES.map(n => parseFloat(n.Composite_10pt));
  const ltvs = NICHES.map(n => parseFloat(n.LTV_USD));
  const avg = arr => arr.reduce((a,b) => a+b, 0) / arr.length;
  const top = composites.filter(c => c >= 9.0).length;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-card"><div class="val">500</div><div class="lbl">Total Niches</div></div>' +
    '<div class="stat-card"><div class="val">100</div><div class="lbl">Core OSHA Ecosystem</div></div>' +
    '<div class="stat-card"><div class="val">' + avg(composites).toFixed(2) + '</div><div class="lbl">Avg Composite Score</div></div>' +
    '<div class="stat-card"><div class="val">' + top + '</div><div class="lbl">Niches Scoring 9.0+</div></div>' +
    '<div class="stat-card"><div class="val">$' + Math.round(avg(ltvs)/1000) + 'K</div><div class="lbl">Avg Client LTV</div></div>' +
    '<div class="stat-card"><div class="val">$30-90K</div><div class="lbl">Annual Retainer Range</div></div>';
}

function showTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

function sortBy(col) {
  if (currentSort === col) {
    currentDir = currentDir === 'desc' ? 'asc' : 'desc';
  } else {
    currentSort = col;
    currentDir = 'desc';
  }
  document.getElementById('sortCol').value = col;
  document.getElementById('sortDir').value = currentDir;
  renderTable();
}

function scoreClass(s) {
  const v = parseFloat(s);
  if (v >= 9.0) return 'score-high';
  if (v >= 8.0) return 'score-mid';
  return 'score-low';
}

function renderTable() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const filterType = document.getElementById('filterType').value;
  const sortCol = document.getElementById('sortCol').value;
  const sortDir = document.getElementById('sortDir').value;
  currentSort = sortCol;
  currentDir = sortDir;

  let data = NICHES.map((n, i) => Object.assign({}, n, {_origIdx: i}));
  if (search) {
    data = data.filter(n => n.Niche.toLowerCase().includes(search) || (n.Primary_Channels || '').toLowerCase().includes(search));
  }
  if (filterType === 'core') data = data.filter(n => n._origIdx < CORE_COUNT);
  if (filterType === 'additional') data = data.filter(n => n._origIdx >= CORE_COUNT);
  data.sort(function(a, b) {
    var va = parseFloat(a[sortCol]) || 0;
    var vb = parseFloat(b[sortCol]) || 0;
    return sortDir === 'desc' ? vb - va : va - vb;
  });
  document.getElementById('countBadge').textContent = data.length + ' niches';

  var rows = data.map(function(n, i) {
    var isCore = n._origIdx < CORE_COUNT;
    var diff = parseInt(n.Delivery_Difficulty);
    var mkt = parseInt(n.Marketability);
    var diffColor = diff <= 2 ? '#5ab85a' : (diff >= 4 ? '#e85757' : '#f0c040');
    var mktColor = mkt >= 4 ? '#5ab85a' : (mkt <= 2 ? '#e85757' : '#f0c040');
    var ltv = parseInt(n.LTV_USD).toLocaleString();
    return '<tr class="' + (isCore ? 'core' : '') + '">' +
      '<td style="color:#5a7aaa;font-size:0.8rem">' + (i+1) + '</td>' +
      '<td style="font-weight:600;color:#ffffff;max-width:280px">' + n.Niche + '</td>' +
      '<td><span class="badge ' + (isCore ? 'badge-core' : 'badge-add') + '">' + (isCore ? 'CORE' : 'ADD') + '</span></td>' +
      '<td class="' + scoreClass(n.Composite_10pt) + '">' + n.Composite_10pt + '</td>' +
      '<td style="color:#8aabdb">$' + ltv + '</td>' +
      '<td style="color:#8aabdb">' + n.Gross_Margin_pct + '%</td>' +
      '<td style="color:#8aabdb">' + n.Sales_Cycle_days + 'd</td>' +
      '<td style="color:#8aabdb;font-size:0.8rem">' + n.Payment + '</td>' +
      '<td style="color:' + diffColor + '">' + n.Delivery_Difficulty + '/5</td>' +
      '<td style="color:' + mktColor + '">' + n.Marketability + '/5</td>' +
      '<td style="color:#5a7aaa;font-size:0.78rem;max-width:200px">' + n.Primary_Channels + '</td>' +
      '</tr>';
  }).join('');

  document.getElementById('tableBody').innerHTML = rows;
}

renderStats();
renderTable();
</script>
</body>
</html>
